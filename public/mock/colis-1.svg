<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Colis kraft vu de dessus, ruban noir et étiquette DR CHOCO">
  <!-- Photo fictive de colis (vue de dessus, 4:3) — à remplacer par les vraies photos de la boutique -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F4F3" />
      <stop offset="1" stop-color="#E4E3E0" />
    </linearGradient>
    <linearGradient id="kraft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D6AB78" />
      <stop offset="0.55" stop-color="#C79A66" />
      <stop offset="1" stop-color="#B58856" />
    </linearGradient>
    <linearGradient id="tape" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#111110" />
      <stop offset="0.45" stop-color="#2A2A27" />
      <stop offset="1" stop-color="#151514" />
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="n" />
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.24  0 0 0 0 0.12  0 0 0 0.16 0" />
      <feComposite in2="SourceGraphic" operator="in" />
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)" />
  <rect x="186" y="118" width="460" height="400" rx="10" fill="#1A1A18" opacity="0.22" filter="url(#shadow)" />
  <rect x="170" y="96" width="460" height="400" rx="8" fill="url(#kraft)" />
  <rect x="170" y="96" width="460" height="400" rx="8" fill="#C79A66" filter="url(#grain)" />
  <rect x="170.5" y="96.5" width="459" height="399" rx="8" fill="none" stroke="#A47748" stroke-width="1.5" />
  <!-- Rabats -->
  <line x1="400" y1="96" x2="400" y2="496" stroke="#9E7246" stroke-width="2" />
  <path d="M184 110 H386 M414 110 H616 M184 482 H386 M414 482 H616" stroke="#B88A58" stroke-width="1.2" />
  <!-- Ruban adhésif noir -->
  <rect x="372" y="90" width="56" height="412" fill="url(#tape)" />
  <rect x="380" y="90" width="5" height="412" fill="#FFFFFF" opacity="0.07" />
  <path d="M372 90 l6 4 l7 -4 l7 4 l7 -4 l7 4 l7 -4 l7 4 l6 -4" fill="none" stroke="#0B0B0A" stroke-width="1" />
  <!-- Étiquette -->
  <g transform="rotate(-3 525 196)">
    <rect x="448" y="142" width="158" height="110" rx="4" fill="#FFFFFF" />
    <rect x="448" y="142" width="158" height="26" rx="4" fill="#1A1A18" />
    <rect x="448" y="160" width="158" height="8" fill="#1A1A18" />
    <circle cx="462" cy="155" r="4" fill="#E31E24" />
    <text x="472" y="160" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="13" letter-spacing="0.5">DR CHOCO</text>
    <text x="460" y="186" fill="#1A1A18" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="10" letter-spacing="1.5">L’INCOMPRIS</text>
    <text x="460" y="202" fill="#6B6C6E" font-family="Arial, Helvetica, sans-serif" font-size="9">Akwa · Douala</text>
    <g fill="#1A1A18">
      <rect x="460" y="214" width="2" height="26" /><rect x="465" y="214" width="1" height="26" /><rect x="469" y="214" width="3" height="26" />
      <rect x="475" y="214" width="1" height="26" /><rect x="479" y="214" width="2" height="26" /><rect x="484" y="214" width="1" height="26" />
      <rect x="488" y="214" width="3" height="26" /><rect x="494" y="214" width="1" height="26" /><rect x="498" y="214" width="2" height="26" />
      <rect x="503" y="214" width="1" height="26" /><rect x="507" y="214" width="3" height="26" /><rect x="513" y="214" width="2" height="26" />
      <rect x="518" y="214" width="1" height="26" /><rect x="522" y="214" width="2" height="26" /><rect x="527" y="214" width="3" height="26" />
    </g>
    <text x="592" y="238" text-anchor="end" fill="#6B6C6E" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="9">VUE 1</text>
  </g>
</svg>
