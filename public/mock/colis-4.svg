<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Colis kraft vu de dessus, format portrait, ruban noir et étiquette DR CHOCO">
  <!-- Photo fictive de colis (vue de dessus, 4:5) — à remplacer par les vraies photos de la boutique -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F4F3" />
      <stop offset="1" stop-color="#E3E2DF" />
    </linearGradient>
    <linearGradient id="kraft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D8AD7A" />
      <stop offset="0.6" stop-color="#C69964" />
      <stop offset="1" stop-color="#B38554" />
    </linearGradient>
    <linearGradient id="tape" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#111110" />
      <stop offset="0.45" stop-color="#2A2A27" />
      <stop offset="1" stop-color="#151514" />
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="21" result="n" />
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.24  0 0 0 0 0.12  0 0 0 0.16 0" />
      <feComposite in2="SourceGraphic" operator="in" />
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)" />
  <rect x="168" y="196" width="500" height="660" rx="10" fill="#1A1A18" opacity="0.22" filter="url(#shadow)" />
  <rect x="150" y="170" width="500" height="660" rx="8" fill="url(#kraft)" />
  <rect x="150" y="170" width="500" height="660" rx="8" fill="#C69964" filter="url(#grain)" />
  <rect x="150.5" y="170.5" width="499" height="659" rx="8" fill="none" stroke="#A47748" stroke-width="1.5" />
  <line x1="400" y1="170" x2="400" y2="830" stroke="#9E7246" stroke-width="2" />
  <path d="M166 186 H386 M414 186 H634 M166 814 H386 M414 814 H634" stroke="#B88A58" stroke-width="1.2" />
  <!-- Ruban adhésif noir, vertical puis croisé -->
  <rect x="370" y="160" width="60" height="680" fill="url(#tape)" />
  <rect x="379" y="160" width="5" height="680" fill="#FFFFFF" opacity="0.07" />
  <rect x="140" y="640" width="520" height="52" fill="url(#tape)" />
  <rect x="140" y="648" width="520" height="4" fill="#FFFFFF" opacity="0.06" />
  <!-- Étiquette -->
  <g transform="rotate(3 535 290)">
    <rect x="450" y="225" width="170" height="124" rx="4" fill="#FFFFFF" />
    <rect x="450" y="225" width="170" height="28" rx="4" fill="#1A1A18" />
    <rect x="450" y="244" width="170" height="9" fill="#1A1A18" />
    <circle cx="465" cy="239" r="4.5" fill="#E31E24" />
    <text x="476" y="244" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="14" letter-spacing="0.5">DR CHOCO</text>
    <text x="463" y="274" fill="#1A1A18" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="11" letter-spacing="1.5">L’INCOMPRIS</text>
    <text x="463" y="292" fill="#6B6C6E" font-family="Arial, Helvetica, sans-serif" font-size="10">Akwa · Douala</text>
    <g fill="#1A1A18">
      <rect x="463" y="304" width="2" height="30" /><rect x="468" y="304" width="1" height="30" /><rect x="472" y="304" width="3" height="30" />
      <rect x="478" y="304" width="1" height="30" /><rect x="482" y="304" width="2" height="30" /><rect x="487" y="304" width="1" height="30" />
      <rect x="491" y="304" width="3" height="30" /><rect x="497" y="304" width="1" height="30" /><rect x="501" y="304" width="2" height="30" />
      <rect x="506" y="304" width="1" height="30" /><rect x="510" y="304" width="3" height="30" /><rect x="516" y="304" width="2" height="30" />
    </g>
    <text x="606" y="332" text-anchor="end" fill="#6B6C6E" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="10">VUE 4</text>
  </g>
</svg>
