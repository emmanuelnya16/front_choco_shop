<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" width="540" height="960" role="img" aria-label="Exemple de capture d’écran de paiement Mobile Money (fictive)">
  <!-- Capture de paiement FICTIVE (sans logo d'opérateur) pour la miniature de la preuve envoyée -->
  <rect width="540" height="960" fill="#FFFFFF" />
  <rect width="540" height="44" fill="#F4F4F3" />
  <text x="24" y="29" fill="#1A1A18" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="16">14:05</text>
  <rect x="470" y="17" width="44" height="14" rx="3" fill="none" stroke="#1A1A18" stroke-width="2" />
  <rect x="473" y="20" width="30" height="8" rx="1" fill="#1A1A18" />
  <text x="270" y="104" text-anchor="middle" fill="#1A1A18" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="20">Mobile Money</text>
  <circle cx="270" cy="210" r="56" fill="#17733F" />
  <path d="M243 211 l18 18 l36 -38" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  <text x="270" y="318" text-anchor="middle" fill="#1A1A18" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="26">Paiement réussi</text>
  <text x="270" y="376" text-anchor="middle" fill="#1A1A18" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="40">63 000 FCFA</text>
  <line x1="40" y1="420" x2="500" y2="420" stroke="#C6C7C8" stroke-width="1.5" />
  <g font-family="Arial, Helvetica, sans-serif" font-size="17">
    <text x="40" y="468" fill="#6B6C6E">Bénéficiaire</text>
    <text x="500" y="468" text-anchor="end" fill="#1A1A18" font-weight="700">DR CHOCO (FICTIF)</text>
    <text x="40" y="516" fill="#6B6C6E">Code marchand</text>
    <text x="500" y="516" text-anchor="end" fill="#1A1A18" font-weight="700">000111</text>
    <text x="40" y="564" fill="#6B6C6E">Transaction</text>
    <text x="500" y="564" text-anchor="end" fill="#1A1A18" font-weight="700">TX-0000-EXEMPLE</text>
    <text x="40" y="612" fill="#6B6C6E">Date</text>
    <text x="500" y="612" text-anchor="end" fill="#1A1A18" font-weight="700">30/10 · 14:05</text>
  </g>
  <line x1="40" y1="650" x2="500" y2="650" stroke="#C6C7C8" stroke-width="1.5" />
  <rect x="40" y="840" width="460" height="64" rx="12" fill="#1A1A18" />
  <text x="270" y="880" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="20">Terminer</text>
  <text x="270" y="760" text-anchor="middle" fill="#E31E24" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="28" opacity="0.18" transform="rotate(-18 270 760)">EXEMPLE</text>
</svg>
